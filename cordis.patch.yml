# The dsh bundle patch shipped inside this package. Declared via
# `dsh.bundle.patch` in package.json, this file becomes an active profile
# layer automatically after `dsh plugin --profile web add dsh-voice-info`
# (or a path/link spec) — no manual cordis.patch.yml editing needed.
- insert:
    - id: voice-info
      name: 'dsh-voice-info'
